name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend npm audit
        run: |
          cd backend
          npm install
          npm audit --audit-level=high
      - name: Frontend npm audit
        run: |
          cd frontend
          npm install
          set +e
          AUDIT_OUTPUT=$(npm audit --audit-level=high 2>&1)
          AUDIT_EXIT=$?
          set -e
          echo "$AUDIT_OUTPUT"
          if [ $AUDIT_EXIT -eq 0 ]; then
            echo "No vulnerabilities found."
            exit 0
          fi
          UNEXPECTED=$(echo "$AUDIT_OUTPUT" | grep -oE "GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}" | sort -u | grep -v "GHSA-qwww-vcr4-c8h2" || true)
          if [ -z "$UNEXPECTED" ]; then
            echo "Only the known/accepted advisory (GHSA-qwww-vcr4-c8h2) is present."
            echo "This affects React Server Components mode; this app is a client-only SPA (BrowserRouter/Routes/Route, no SSR/RSC), so it does not apply. See commit c149fdd for full reasoning."
            exit 0
          else
            echo "Unexpected vulnerability found beyond the accepted advisory:"
            echo "$UNEXPECTED"
            exit 1
          fi