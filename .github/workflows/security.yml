name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend npm audit
        run: |
          cd backend
          npm install
          npm audit --audit-level=high
      - name: Frontend npm audit
        run: |
          cd frontend
          npm install
          npm audit --audit-level=high
